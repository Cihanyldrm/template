<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-posta Dogrulama - KurumsalCo</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="theme-btn" onclick="document.body.classList.toggle('dark');this.textContent=document.body.classList.contains('dark')?'\u263E':'\u2600'">&#9788;</div>
  <div class="auth-page">
    <div class="auth-side">
      <div class="auth-side-content">
        <div class="auth-side-logo">K</div>
        <h2>Neredeyse Tamam!</h2>
        <p>E-posta adresinizi dogrulayin ve hesabinizi aktif hale getirin.</p>
      </div>
    </div>
    <div class="auth-main">
      <div class="auth-card" style="text-align:center;">
        <div class="verify-icon" style="background:rgba(59,130,246,.1);color:var(--info);">&#128231;</div>
        <h1 style="font-size:24px;font-weight:800;margin-bottom:8px;">E-postanizi Kontrol Edin</h1>
        <p style="color:var(--text-sec);font-size:15px;margin-bottom:8px;">Dogrulama kodu su adrese gönderildi:</p>
        <p style="font-weight:700;font-size:16px;margin-bottom:28px;color:var(--primary);">a****@kurumsal.com</p>
        <form class="auth-form" onsubmit="return false;">
          <div class="form-group" style="text-align:left;">
            <label class="form-label" style="text-align:center;">6 Haneli Dogrulama Kodu</label>
            <div class="otp-row">
              <input type="text" class="otp-input" maxlength="1" autofocus>
              <input type="text" class="otp-input" maxlength="1">
              <input type="text" class="otp-input" maxlength="1">
              <input type="text" class="otp-input" maxlength="1">
              <input type="text" class="otp-input" maxlength="1">
              <input type="text" class="otp-input" maxlength="1">
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Dogrula &#10003;</button>
          <div class="info-box info" style="text-align:left;">
            <span style="font-size:18px;flex-shrink:0;">&#9203;</span>
            <span>Kod 10 dakika geçerlidir. Spam klasörünü de kontrol ediniz.</span>
          </div>
          <div style="text-align:center;">
            <p style="font-size:14px;color:var(--text-muted);">Kod gelmedi mi? <a href="#" class="form-link">Tekrar Gönder</a></p>
          </div>
        </form>
        <div class="auth-footer">
          <a href="login.html">&#8592; Girise dön</a>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.querySelectorAll('.otp-input').forEach(function(inp,i,arr){
      inp.addEventListener('input',function(){
        if(this.value.length===1 && i<arr.length-1) arr[i+1].focus();
      });
      inp.addEventListener('keydown',function(e){
        if(e.key==='Backspace' && !this.value && i>0) arr[i-1].focus();
      });
    });
  </script>
</body>
</html>
