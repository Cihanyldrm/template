<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sifre Sifirla - KurumsalCo</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="theme-btn" onclick="document.body.classList.toggle('dark');this.textContent=document.body.classList.contains('dark')?'\u263E':'\u2600'">&#9788;</div>
  <div class="auth-page">
    <div class="auth-side">
      <div class="auth-side-content">
        <div class="auth-side-logo">K</div>
        <h2>Yeni Sifre Belirleyin</h2>
        <p>Güçlü bir sifre seçerek hesabinizi koruma altina alin.</p>
      </div>
    </div>
    <div class="auth-main">
      <div class="auth-card">
        <div class="auth-card-header">
          <div class="auth-logo-sm">K</div>
          <h1>Yeni Sifre &#128274;</h1>
          <p>Yeni sifrenizi belirleyin. Güçlü bir sifre seçin.</p>
        </div>
        <form class="auth-form" onsubmit="return false;">
          <div class="form-group">
            <label class="form-label">Yeni Sifre <span class="req">*</span></label>
            <div class="input-wrapper">
              <span class="input-icon">&#128274;</span>
              <input type="password" class="form-input" placeholder="Yeni sifreniz" required>
              <span class="input-toggle" onclick="var i=this.previousElementSibling;i.type=i.type==='password'?'text':'password'">&#128065;</span>
            </div>
            <div class="pw-strength"><div class="pw-bar strong"></div><div class="pw-bar strong"></div><div class="pw-bar strong"></div><div class="pw-bar medium"></div></div>
            <div class="form-hint">En az 8 karakter, büyük/küçük harf, rakam ve özel karakter.</div>
          </div>
          <div class="form-group">
            <label class="form-label">Sifre Tekrar <span class="req">*</span></label>
            <div class="input-wrapper">
              <span class="input-icon">&#128274;</span>
              <input type="password" class="form-input" placeholder="Sifrenizi tekrar girin" required>
            </div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sifreyi Güncelle &#10003;</button>
          <div style="text-align:center;">
            <a href="login.html" class="form-link">&#8592; Giris sayfasina dön</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
