<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekran Kilidi - KurumsalCo</title>
  <link rel="stylesheet" href="auth.css">
  <style>
    .lock-page{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:100vh;padding:40px 20px;
      background:var(--bg-page);position:relative;overflow:hidden;
    }
    .lock-page::before{
      content:'';position:absolute;width:600px;height:600px;
      background:radial-gradient(circle,var(--primary-glow) 0%,transparent 70%);
      top:-200px;right:-200px;pointer-events:none;opacity:.4;
    }
    .lock-page::after{
      content:'';position:absolute;width:400px;height:400px;
      background:radial-gradient(circle,rgba(6,182,212,.15) 0%,transparent 70%);
      bottom:-150px;left:-150px;pointer-events:none;opacity:.4;
    }
    body.dark .lock-page::before,body.dark .lock-page::after{opacity:.2;}
    .lock-card{
      position:relative;z-index:1;
      width:100%;max-width:400px;
      background:var(--bg-card);border:1px solid var(--border);
      border-radius:var(--r-xl);padding:44px 36px;
      box-shadow:var(--shadow-xl);
      animation:authFadeIn .5s ease forwards;
      text-align:center;
    }
    .lock-time{font-size:48px;font-weight:900;letter-spacing:-2px;margin-bottom:4px;}
    .lock-date{font-size:14px;color:var(--text-muted);margin-bottom:36px;}
  </style>
</head>
<body>
  <div class="theme-btn" onclick="document.body.classList.toggle('dark');this.textContent=document.body.classList.contains('dark')?'\u263E':'\u2600'">&#9788;</div>
  <div class="lock-page">
    <div class="lock-card">
      <div class="lock-time" id="lockTime">14:32</div>
      <div class="lock-date" id="lockDate">6 Subat 2026, Cuma</div>
      <div class="lock-avatar">AY</div>
      <div class="lock-name">Ahmet Yilmaz</div>
      <div class="lock-role">Süper Admin</div>
      <form class="auth-form" onsubmit="return false;">
        <div class="form-group">
          <div class="input-wrapper">
            <span class="input-icon">&#128274;</span>
            <input type="password" class="form-input" placeholder="Sifrenizi girin" required autofocus>
            <span class="input-toggle" onclick="var i=this.previousElementSibling;i.type=i.type==='password'?'text':'password'">&#128065;</span>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Kilidi Aç &#128275;</button>
      </form>
      <div style="margin-top:20px;">
        <a href="login.html" class="form-link" style="font-size:13px;">Farkli hesapla giris yap &#8594;</a>
      </div>
    </div>
  </div>
  <script>
    function updateTime(){
      var d=new Date();
      document.getElementById('lockTime').textContent=d.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    }
    updateTime();setInterval(updateTime,30000);
  </script>
</body>
</html>
